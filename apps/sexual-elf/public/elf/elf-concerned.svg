<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <!-- Body -->
  <path d="M 36 98 Q 32 118 34 148 Q 60 154 86 148 Q 88 118 84 98 Q 60 106 36 98 Z" fill="#EAF3F1" stroke="#3F8D8A" stroke-width="1.5"/>
  <!-- Belt -->
  <line x1="37" y1="122" x2="83" y2="122" stroke="#224B52" stroke-width="2"/>
  <rect x="55" y="119" width="10" height="6" rx="1" fill="#224B52"/>
  <!-- Neck -->
  <rect x="53" y="84" width="14" height="12" rx="4" fill="#A9C8C1" stroke="#3F8D8A" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="60" cy="64" rx="24" ry="26" fill="#A9C8C1" stroke="#3F8D8A" stroke-width="1.5"/>
  <!-- Pointed ears -->
  <path d="M 36 58 L 28 46 L 40 54" fill="#A9C8C1" stroke="#3F8D8A" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 84 58 L 92 46 L 80 54" fill="#A9C8C1" stroke="#3F8D8A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Hair -->
  <path d="M 36 50 Q 60 38 84 50 Q 80 34 60 32 Q 40 34 36 50 Z" fill="#224B52"/>
  <!-- Brow furrow -->
  <path d="M 48 56 Q 52 52 56 55" stroke="#224B52" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 64 55 Q 68 52 72 56" stroke="#224B52" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes — steady, slightly wide -->
  <circle cx="52" cy="64" r="3" fill="#224B52"/>
  <circle cx="68" cy="64" r="3" fill="#224B52"/>
  <circle cx="52.8" cy="63" r="0.9" fill="#EAF3F1"/>
  <circle cx="68.8" cy="63" r="0.9" fill="#EAF3F1"/>
  <!-- Nose -->
  <path d="M 58 70 Q 60 73 62 70" stroke="#3F8D8A" stroke-width="1" fill="none"/>
  <!-- Mouth — downturned -->
  <path d="M 54 80 Q 60 77 66 80" stroke="#224B52" stroke-width="1.5" fill="none"/>
  <!-- Arms — one raised (gesture) -->
  <path d="M 37 103 Q 24 118 26 136" stroke="#3F8D8A" stroke-width="2" fill="none"/>
  <path d="M 83 100 Q 98 108 96 124" stroke="#3F8D8A" stroke-width="2" fill="none"/>
  <!-- Hands -->
  <circle cx="26" cy="139" r="4.5" fill="#A9C8C1" stroke="#3F8D8A" stroke-width="1"/>
  <circle cx="96" cy="127" r="4.5" fill="#A9C8C1" stroke="#3F8D8A" stroke-width="1"/>
  <!-- Star mark — amber tint for urgency -->
  <path d="M 60 6 L 62 12 L 68 12 L 63 16 L 65 22 L 60 18 L 55 22 L 57 16 L 52 12 L 58 12 Z" fill="#C98A2E" opacity="0.8"/>
</svg>
